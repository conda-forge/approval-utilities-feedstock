schema_version: 1

context:
  version: "20.0.0"

package:
  name: approval-utilities
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/approval-utilities/approval_utilities-${{ version }}.tar.gz
  sha256: b24059fca98d45b23155ffc9aabaf25ada694c0f20d30103bbbaaa87e1871114

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=69.0.0
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - typing_extensions >=4.12.0

tests:
  - python:
      imports:
        - approval_utilities
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Utilities for your production code that work well with approvaltests
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/approvals/ApprovalTests.Python

extra:
  recipe-maintainers:
    - apmorton
    - mgorny
